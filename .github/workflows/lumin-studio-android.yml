name: LUMIN Studio Android CI
on:
  workflow_dispatch:
  push:
    branches: [feature/lumin-studio]
    paths: ['studio/**', '.github/workflows/lumin-studio-android.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Check Flutter project
        run: |
          test -f pubspec.yaml || { echo 'Flutter source not yet uploaded'; exit 1; }
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: lumin-studio-debug-apk
          path: studio/build/app/outputs/flutter-apk/app-debug.apk
