plugins { id 'com.android.application' }

def props = new Properties()
def lp = rootProject.file('local.properties')
if (lp.exists()) lp.withInputStream { props.load(it) }
def tmdbToken = System.getenv('TMDB_TOKEN') ?: props.getProperty('tmdb.token', '')

// Gera assets/index.html a partir de web/index.template.html + catalog.json + token TMDB (o token nunca vai para o git)
def genAssets = layout.buildDirectory.dir('generated/lumin-assets')
tasks.register('generateLuminAssets') {
    inputs.file(rootProject.file('web/index.template.html'))
    inputs.file(rootProject.file('catalog.json'))
    inputs.property('token', tmdbToken)
    outputs.dir(genAssets)
    doLast {
        if (!tmdbToken) throw new GradleException('Falta o token TMDB: define TMDB_TOKEN ou tmdb.token em local.properties')
        def html = rootProject.file('web/index.template.html').getText('UTF-8')
        def cat = rootProject.file('catalog.json').getText('UTF-8').replaceAll(/\s*\n\s*/, '')
        html = html.replace('/*CATALOG*/[]', cat).replace('__TMDB_TOKEN__', tmdbToken)
        def out = genAssets.get().file('index.html').asFile
        out.parentFile.mkdirs(); out.setText(html, 'UTF-8')
    }
}

android {
    namespace 'pt.luminai.filmes'
    compileSdk 34
    defaultConfig {
        applicationId 'pt.luminai.filmes'
        minSdk 21
        targetSdk 34
        versionCode 12
        versionName '3.3.1'
    }
    sourceSets { main { assets.srcDirs += [genAssets.get().asFile] } }
    signingConfigs {
        release {
            def ks = System.getenv('LUMIN_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('LUMIN_KEYSTORE_PASS')
                keyAlias System.getenv('LUMIN_KEY_ALIAS') ?: 'lumin'
                keyPassword System.getenv('LUMIN_KEYSTORE_PASS')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('LUMIN_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.mediarouter:mediarouter:1.7.0'
    implementation 'com.google.android.gms:play-services-cast-framework:21.5.0'
    // alinha kotlin-stdlib-jdk7/jdk8 com o kotlin-stdlib (evita classes duplicadas)
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'org.java-websocket:Java-WebSocket:1.5.7'
}
tasks.named('preBuild') { dependsOn 'generateLuminAssets' }
